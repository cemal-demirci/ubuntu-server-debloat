name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck -S warning ubuntu2404-debloat.sh tests/*.sh

  e2e:
    name: End-to-end on a real Ubuntu 24.04 VM
    needs: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Stop background apt jobs
        run: sudo systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
      - name: Dry run, debloat, second run, restore
        run: sudo bash tests/e2e.sh
